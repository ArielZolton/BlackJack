<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Async/Await Pokémon Review</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 2rem;
            background-color: #f8f8f8;
        }

        button {
            padding: 10px 20px;
            margin-bottom: 1rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        .pokemon-card {
            padding: 1rem;
            border-radius: 8px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            max-width: 300px;
            margin-top: 1rem;
        }

        .pokemon-card img {
            width: 150px;
            height: 150px;
            display: block;
            margin: 0 auto 1rem auto;
        }

        .pokemon-card h3 {
            text-align: center;
            text-transform: capitalize;
        }

        .pokemon-card p {
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Async/Await Review with PokéAPI</h1>

    <button id="fetchPokemonAsync">Fetch Random Pokémon (Async/Await)</button>
    <div id="pokemonContainerAsync"></div>

    <button id="stepTutorialBtn">Step-by-Step Button</button>
    <div id="stepTutorialDisplay" style="margin-top: 1rem; font-weight: bold;"></div>

    <script src="index.js"></script>

</body>
</html>
