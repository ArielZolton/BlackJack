<!DOCTYPE html> <!-- this sets the document/file type -->
<html lang="en">
<head> 
    <!-- head is metadate -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consolidated HTML Notes</title>
</head>
<body>
    <header>
        <!-- header includes nav bar, other things that might be in a webpage header -->
        <!-- nav>ul>li*3 -->
        <nav>
            <ul>
                <!-- ul and li have to do with lists -->
                <li>Home</li>
                <li>Portfolio</li>
                <li>About</li>
                <li>Contact</li>
            </ul>

            <!-- this is how to link pages -->
            <!-- <li><a href="#">Home</a></li>
                <li><a href="./portfolio.html">Portfolio</a></li> -->
            
        </nav>
    </header>
    <main>
        <!-- section>h1 -->
        <section>
            <h1>Consolidated HTML Notes</h1>
            <!-- how to include an image -- have to have it in the same folder/directory -->
            <img
                src="https://technicalseo.com/insights/wp-content/uploads/2019/04/javascript.gif" 
                alt="lego dancing LOL"
                width="200px"
            >
            
            <img src="../felipe-vampire.png"
            alt="Felipe the Vampire"
            width="200px"  >

            <blockquote>this is a blockquote -- leverage is a company that helps you leverage your time</blockquote>
            <p>this is a paragraph -- Leverage is a platform for trading and investing in stocks, options, and cryptocurrencies.</p>
        </section>

        <section> <!-- buttons can be clicked, disabled, etc -->
            <button type="button">Buy</button>
            <button type="button">Sell</button>
        </section>
        <div>
            <!-- div is another type of tag -->
        </div>
    </main>
    <footer>
        <!-- footer is the footer of the website, possibly more nav, copyright, etc -->
        <p>&copy; Copyright 2025 MyNotesHTML</p>
    </footer>
</body>
</html>
